name: Publish pi-stable

# Publishes all 5 pi-stable-* packages in dependency order via scripts/publish.mjs.
# Authentication: npm trusted publishing (OIDC). The npm CLI exchanges the
# GitHub Actions ID token for a short-lived npm token per package. Requires
# `permissions: id-token: write`, the `npm-publish` GitHub environment, and a
# trusted publisher configured on the npm side for this repo + workflow.
# No static token.
# Triggers:
#   1. push tag v*        -> builds and publishes
#   2. workflow_dispatch  -> manual; defaults to dry-run (validate only).
#                            Set dry_run input to 'false' to actually publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, do not publish)"
        required: false
        default: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Build all packages
        run: npm run build

      - name: Validate packages (dry run)
        run: node scripts/publish.mjs --dry-run

      # Node 22.19.0 ships npm 10.9.x, which has no OIDC token exchange.
      # Trusted publishing requires npm >= 11.5.0 (upstream pins 11.16.0).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Publish all packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false') }}
        run: node scripts/publish.mjs
